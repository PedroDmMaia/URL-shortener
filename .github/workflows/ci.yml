name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - CreateUrlLambda
          - RedirectUrlShotener

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test -f ${{ matrix.project }}/pom.xml

  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Lambda JARs for Terraform
        run: |
          mvn --batch-mode --no-transfer-progress -f CreateUrlLambda/pom.xml package -DskipTests
          mvn --batch-mode --no-transfer-progress -f RedirectUrlShotener/pom.xml package -DskipTests

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize providers without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform -chdir=terraform validate
